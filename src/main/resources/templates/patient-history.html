<!DOCTYPE html>
<html>

<head>

    <title>Patient History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2>Patient History</h2>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>Date</th>
            <th>Doctor</th>
            <th>Diagnosis</th>
            <th>Treatment</th>

        </tr>

        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>

</div>

<script>

    const params =
        new URLSearchParams(
            window.location.search
        );

    const patientId =
        params.get('id');

    fetch(
        '/api/reports/patient-history/'
        + patientId
    )
        .then(response => response.json())
        .then(data => {

            let html = '';

            data.forEach(exam => {

                html += `
                <tr>
                    <td>${exam.examinationDate}</td>
                    <td>${exam.doctorName}</td>
                    <td>${exam.diagnosisName}</td>
                    <td>${exam.treatment}</td>
                </tr>
            `;
            });

            document.getElementById(
                'tableBody'
            ).innerHTML = html;
        });

</script>

</body>
</html>
