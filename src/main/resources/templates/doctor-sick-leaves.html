<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>My Sick Leaves</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between">

        <h2>My Sick Leaves</h2>

        <a href="/"
           class="btn btn-secondary">
            Home
        </a>

    </div>

    <hr>

    <h4>Create Sick Leave</h4>

    <form id="sickLeaveForm">

        <div class="mb-3">

            <label class="form-label">
                Examination
            </label>

            <select id="examinationId"
                    class="form-select">
            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Start Date
            </label>

            <input type="date"
                   id="startDate"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Days
            </label>

            <input type="number"
                   id="days"
                   class="form-control">

        </div>

        <button type="submit"
                class="btn btn-primary">

            Create Sick Leave

        </button>

    </form>

    <hr>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>Start Date</th>
            <th>Days</th>
            <th>Patient</th>
            <th>Examination ID</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>

</div>

<script>

    loadDoctorExaminations();
    loadMySickLeaves();

    function loadDoctorExaminations() {

        fetch('/api/examinations/doctor/my')
            .then(response => response.json())
            .then(data => {

                let select =
                    document.getElementById(
                        'examinationId'
                    );

                select.innerHTML = '';

                data.forEach(examination => {

                    select.innerHTML += `
                        <option value="${examination.id}">
                            #${examination.id}
                            - ${examination.patientName}
                            - ${examination.diagnosisName}
                        </option>
                    `;
                });

            });
    }

    function loadMySickLeaves() {

        fetch('/api/sick-leaves/my')
            .then(response => response.json())
            .then(data => {

                let table =
                    document.getElementById(
                        'tableBody'
                    );

                table.innerHTML = '';

                data.forEach(sickLeave => {

                    table.innerHTML += `
                        <tr>

                            <td>${sickLeave.startDate}</td>

                            <td>${sickLeave.days}</td>

                            <td>${sickLeave.patientName}</td>

                            <td>${sickLeave.examinationId}</td>

<td>

    <button
        class="btn btn-danger btn-sm"
        onclick="deleteSickLeave(${sickLeave.id})">

        Delete

    </button>

</td>

                        </tr>
                    `;
                });

            });
    }

    document.getElementById(
        'sickLeaveForm'
    ).addEventListener(
        'submit',
        function(event) {

            event.preventDefault();

            let sickLeave = {

                examinationId:
                    Number(
                        document.getElementById(
                            'examinationId'
                        ).value
                    ),

                startDate:
                document.getElementById(
                    'startDate'
                ).value,

                days:
                    Number(
                        document.getElementById(
                            'days'
                        ).value
                    )
            };

            fetch('/api/sick-leaves', {

                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify(
                        sickLeave
                    )

            })
                .then(() => {

                    document.getElementById(
                        'sickLeaveForm'
                    ).reset();

                    loadMySickLeaves();

                });

        });
    function deleteSickLeave(id) {

        if (!confirm(
            'Delete this sick leave?'
        )) {

            return;
        }

        fetch('/api/sick-leaves/' + id, {

            method: 'DELETE'

        })
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        'Delete failed'
                    );
                }

                loadMySickLeaves();

            })
            .catch(error => {

                console.error(error);

                alert(
                    'Error deleting sick leave'
                );
            });
    }
</script>

</body>
</html>
