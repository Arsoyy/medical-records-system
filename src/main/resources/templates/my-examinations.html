<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>My Examinations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<body>

<div class="container mt-4">

    <h2>My Examinations</h2>

    <table class="table table-bordered">

        <thead>
        <tr>
            <th>Date</th>
            <th>Doctor</th>
            <th>Diagnosis</th>
            <th>Treatment</th>
            <th>Price</th>
        </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>

</div>

<script>

    fetch('/api/examinations/my')
        .then(response => response.json())
        .then(data => {

            let html = '';

            data.forEach(exam => {

                html += `
                <tr>
                    <td>${exam.examinationDate}</td>
                    <td>${exam.doctorName}</td>
                    <td>${exam.diagnosisName}</td>
                    <td>${exam.treatment}</td>
                    <td>${exam.price}</td>
                </tr>
            `;
            });

            document.getElementById(
                'tableBody'
            ).innerHTML = html;
        });

</script>

</body>
</html>
