<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Doctors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between">

        <h2>Doctors</h2>

        <a href="/"
           class="btn btn-secondary">
            Home
        </a>

    </div>

    <hr>

    <h4>Add Doctor</h4>

    <form id="doctorForm">

        <div class="mb-3">

            <label class="form-label">
                Doctor Identifier
            </label>

            <input type="text"
                   id="doctorIdentifier"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Full Name
            </label>

            <input type="text"
                   id="fullName"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Specialty
            </label>

            <input type="text"
                   id="specialty"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input type="text"
                   id="username"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   id="password"
                   class="form-control">

        </div>

        <button type="submit"
                class="btn btn-primary">
            Add Doctor
        </button>

    </form>

    <hr>

    <h4>All Doctors</h4>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>ID</th>

            <th>Identifier</th>

            <th>Name</th>

            <th>Specialty</th>

        </tr>

        </thead>

        <tbody id="doctorsTable">

        </tbody>

    </table>

</div>

<script>

    loadDoctors();

    function loadDoctors() {

        fetch('/api/doctors')
            .then(response => response.json())
            .then(data => {

                let table =
                    document.getElementById('doctorsTable');

                table.innerHTML = '';

                data.forEach(doctor => {

                    table.innerHTML += `
                        <tr>
                            <td>${doctor.id}</td>
                            <td>${doctor.doctorIdentifier}</td>
                            <td>${doctor.fullName}</td>
                            <td>${doctor.specialty}</td>
                        </tr>
                    `;
                });

            });
    }

    document.getElementById('doctorForm')
        .addEventListener('submit', function (event) {

            event.preventDefault();

            let doctor = {

                doctorIdentifier:
                document.getElementById(
                    'doctorIdentifier'
                ).value,

                fullName:
                document.getElementById(
                    'fullName'
                ).value,

                specialty:
                document.getElementById(
                    'specialty'
                ).value,

                username:
                document.getElementById(
                    'username'
                ).value,

                password:
                document.getElementById(
                    'password'
                ).value
            };

            fetch('/api/doctors', {

                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify(doctor)

            })
                .then(() => {

                    document.getElementById(
                        'doctorForm'
                    ).reset();

                    loadDoctors();

                });

        });

</script>

</body>
</html>
