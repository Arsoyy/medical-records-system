<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Sick Leaves</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between">

        <h2>Sick Leaves</h2>

        <a href="/"
           class="btn btn-secondary">
            Home
        </a>

    </div>

    <hr>

    <h4>Create Sick Leave</h4>

    <form id="sickLeaveForm">

        <div class="mb-3">

            <label class="form-label">
                Examination
            </label>

            <select id="examinationId"
                    class="form-select">
            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Start Date
            </label>

            <input type="date"
                   id="startDate"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Days
            </label>

            <input type="number"
                   id="days"
                   class="form-control">

        </div>

        <button type="submit"
                class="btn btn-primary">
            Create Sick Leave
        </button>

    </form>

    <hr>

    <h4>All Sick Leaves</h4>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>ID</th>

            <th>Start Date</th>

            <th>Days</th>

            <th>Doctor</th>

            <th>Patient</th>

            <th>Examination ID</th>

        </tr>

        </thead>

        <tbody id="sickLeavesTable">

        </tbody>

    </table>

</div>

<script>

    loadExaminations();
    loadSickLeaves();

    function loadExaminations() {

        fetch('/api/examinations')
            .then(response => response.json())
            .then(data => {

                let select =
                    document.getElementById(
                        'examinationId'
                    );

                select.innerHTML = '';

                data.forEach(examination => {

                    select.innerHTML += `
                        <option value="${examination.id}">
                            #${examination.id}
                            - ${examination.patientName}
                            - ${examination.diagnosisName}
                        </option>
                    `;
                });

            });
    }

    function loadSickLeaves() {

        fetch('/api/sick-leaves')
            .then(response => response.json())
            .then(data => {

                let table =
                    document.getElementById(
                        'sickLeavesTable'
                    );

                table.innerHTML = '';

                data.forEach(sickLeave => {

                    table.innerHTML += `
                        <tr>

                            <td>${sickLeave.id}</td>

                            <td>${sickLeave.startDate}</td>

                            <td>${sickLeave.days}</td>

                            <td>${sickLeave.doctorName}</td>

                            <td>${sickLeave.patientName}</td>

                            <td>${sickLeave.examinationId}</td>

                        </tr>
                    `;
                });

            });
    }

    document.getElementById(
        'sickLeaveForm'
    ).addEventListener(
        'submit',
        function(event) {

            event.preventDefault();

            let sickLeave = {

                examinationId:
                    Number(
                        document.getElementById(
                            'examinationId'
                        ).value
                    ),

                startDate:
                document.getElementById(
                    'startDate'
                ).value,

                days:
                    Number(
                        document.getElementById(
                            'days'
                        ).value
                    )
            };

            fetch('/api/sick-leaves', {

                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify(
                        sickLeave
                    )

            })
                .then(() => {

                    document.getElementById(
                        'sickLeaveForm'
                    ).reset();

                    loadSickLeaves();

                });

        });

</script>

</body>
</html>
