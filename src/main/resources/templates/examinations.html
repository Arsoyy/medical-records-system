<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Examinations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between">

        <h2>Examinations</h2>

        <a href="/"
           class="btn btn-secondary">
            Home
        </a>

    </div>

    <hr>

    <h4>Create Examination</h4>

    <form id="examinationForm">

        <div class="mb-3">

            <label class="form-label">
                Doctor
            </label>

            <select id="doctorId"
                    class="form-select">
            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Patient
            </label>

            <select id="patientId"
                    class="form-select">
            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Diagnosis
            </label>

            <select id="diagnosisId"
                    class="form-select">
            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Treatment
            </label>

            <input type="text"
                   id="treatment"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Price
            </label>

            <input type="number"
                   step="0.01"
                   id="price"
                   class="form-control">

        </div>

        <button type="submit"
                class="btn btn-primary">
            Create Examination
        </button>

    </form>

    <hr>

    <h4>All Examinations</h4>

    <table class="table table-bordered">

        <thead>
        <tr>

            <th>ID</th>

            <th>Date</th>

            <th>Doctor</th>

            <th>Patient</th>

            <th>Diagnosis</th>

            <th>Treatment</th>

            <th>Price</th>

            <th>Payment</th>

            <th>Actions</th>

        </tr>
        </thead>

        <tbody id="examinationsTable">

        </tbody>

    </table>

</div>

<script>

    loadDoctors();
    loadPatients();
    loadDiagnoses();
    loadExaminations();

    function loadDoctors() {

        fetch('/api/doctors')
            .then(response => response.json())
            .then(data => {

                let select =
                    document.getElementById('doctorId');

                select.innerHTML = '';

                data.forEach(doctor => {

                    select.innerHTML += `
                        <option value="${doctor.id}">
                            ${doctor.fullName}
                        </option>
                    `;
                });

            });
    }

    function loadPatients() {

        fetch('/api/patients')
            .then(response => response.json())
            .then(data => {

                let select =
                    document.getElementById('patientId');

                select.innerHTML = '';

                data.forEach(patient => {

                    select.innerHTML += `
                        <option value="${patient.id}">
                            ${patient.fullName}
                        </option>
                    `;
                });

            });
    }

    function loadDiagnoses() {

        fetch('/api/diagnoses')
            .then(response => response.json())
            .then(data => {

                let select =
                    document.getElementById('diagnosisId');

                select.innerHTML = '';

                data.forEach(diagnosis => {

                    select.innerHTML += `
                        <option value="${diagnosis.id}">
                            ${diagnosis.name}
                        </option>
                    `;
                });

            });
    }

    function loadExaminations() {

        fetch('/api/examinations')
            .then(response => response.json())
            .then(data => {

                let table =
                    document.getElementById(
                        'examinationsTable'
                    );

                table.innerHTML = '';

                data.forEach(examination => {

                    table.innerHTML += `
    <tr>

        <td>${examination.id}</td>

        <td>${examination.examinationDate}</td>

        <td>${examination.doctorName}</td>

        <td>${examination.patientName}</td>

        <td>${examination.diagnosisName}</td>

        <td>${examination.treatment}</td>

        <td>${examination.price}</td>

        <td>${examination.paymentType}</td>

        <td>

            <button
                class="btn btn-danger btn-sm"
                onclick="deleteExamination(${examination.id})">

                Delete

            </button>

        </td>

    </tr>
                    `;
                });

            });
    }

    document.getElementById(
        'examinationForm'
    ).addEventListener(
        'submit',
        function (event) {

            event.preventDefault();

            let examination = {

                doctorId:
                    Number(
                        document.getElementById(
                            'doctorId'
                        ).value
                    ),

                patientId:
                    Number(
                        document.getElementById(
                            'patientId'
                        ).value
                    ),

                diagnosisId:
                    Number(
                        document.getElementById(
                            'diagnosisId'
                        ).value
                    ),

                treatment:
                document.getElementById(
                    'treatment'
                ).value,

                price:
                    Number(
                        document.getElementById(
                            'price'
                        ).value
                    )
            };

            fetch('/api/examinations', {

                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify(examination)

            })
                .then(() => {

                    document.getElementById(
                        'examinationForm'
                    ).reset();

                    loadExaminations();

                });

        });
    function deleteExamination(id) {

        if (!confirm(
            'Delete this examination?'
        )) {

            return;
        }

        fetch('/api/examinations/' + id, {

            method: 'DELETE'

        })
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        'Delete failed'
                    );
                }

                loadExaminations();

            })
            .catch(error => {

                console.error(error);

                alert(
                    'Error deleting examination'
                );
            });
    }
</script>

</body>
</html>
