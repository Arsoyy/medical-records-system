<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<script>

    loadDoctors();
    loadPatients();
    loadDiagnoses();

    function loadDoctors() {

        fetch('/api/doctors')
            .then(response => response.json())
            .then(data => {

                let select =
                    document.getElementById(
                        'doctorSelect'
                    );

                select.innerHTML = '';

                data.forEach(doctor => {

                    select.innerHTML += `
                    <option value="${doctor.id}">
                        ${doctor.fullName}
                    </option>
                `;
                });
            });
    }

    function loadPatients() {

        fetch('/api/patients')
            .then(response => response.json())
            .then(data => {

                let select =
                    document.getElementById(
                        'patientSelect'
                    );

                select.innerHTML = '';

                data.forEach(patient => {

                    select.innerHTML += `
                    <option value="${patient.id}">
                        ${patient.fullName}
                    </option>
                `;
                });
            });
    }

    function loadDiagnoses() {

        fetch('/api/diagnoses')
            .then(response => response.json())
            .then(data => {

                let select =
                    document.getElementById(
                        'diagnosisSelect'
                    );

                select.innerHTML = '';

                data.forEach(diagnosis => {

                    select.innerHTML += `
                    <option value="${diagnosis.id}">
                        ${diagnosis.name}
                    </option>
                `;
                });
            });
    }

    function patientsByDiagnosis() {

        let id =
            document.getElementById(
                'diagnosisSelect'
            ).value;

        fetch(
            '/api/reports/patients-by-diagnosis/' + id
        )
            .then(response => response.json())
            .then(showPatients);
    }

    function patientsByDoctor() {

        let id =
            document.getElementById(
                'doctorSelect'
            ).value;

        fetch(
            '/api/reports/patients-by-doctor/' + id
        )
            .then(response => response.json())
            .then(showPatients);
    }

    function patientHistory() {

        let id =
            document.getElementById(
                'patientSelect'
            ).value;

        fetch(
            '/api/reports/patient-history/' + id
        )
            .then(response => response.json())
            .then(showExaminations);
    }

    function doctorExaminations() {

        let id =
            document.getElementById(
                'doctorSelect'
            ).value;

        fetch(
            '/api/reports/doctor-examinations/' + id
        )
            .then(response => response.json())
            .then(showExaminations);
    }

    function doctorExaminationsPeriod() {

        let doctorId =
            document.getElementById(
                'doctorSelect'
            ).value;

        let startDate =
            document.getElementById(
                'startDate'
            ).value;

        let endDate =
            document.getElementById(
                'endDate'
            ).value;

        fetch(
            `/api/reports/doctor-examinations-period?doctorId=${doctorId}&startDate=${startDate}&endDate=${endDate}`
        )
            .then(response => response.json())
            .then(showExaminations);
    }

    function mostCommonDiagnosis() {

        fetch(
            '/api/reports/most-common-diagnosis'
        )
            .then(response => response.json())
            .then(data => {

                document.getElementById(
                    'result'
                ).innerHTML = `
                <div class="alert alert-info">
                    <strong>${data.diagnosisName}</strong>
                    (${data.occurrenceCount})
                </div>
            `;
            });
    }

    function totalRevenue() {

        fetch(
            '/api/reports/total-revenue'
        )
            .then(response => response.json())
            .then(data => {

                document.getElementById(
                    'result'
                ).innerHTML = `
                <div class="alert alert-success">
                    Total Revenue:
                    ${data.totalAmount}
                </div>
            `;
            });
    }

    function revenueByDoctor() {

        fetch(
            '/api/reports/revenue-by-doctor'
        )
            .then(response => response.json())
            .then(data => {

                let html =
                    '<table class="table table-bordered"><tr><th>Doctor</th><th>Revenue</th></tr>';

                data.forEach(row => {

                    html += `
                    <tr>
                        <td>${row.doctorName}</td>
                        <td>${row.totalAmount}</td>
                    </tr>
                `;
                });

                html += '</table>';

                document.getElementById(
                    'result'
                ).innerHTML = html;
            });
    }

    function patientCountByDoctor() {

        fetch(
            '/api/reports/patient-count-by-doctor'
        )
            .then(response => response.json())
            .then(data => {

                let html =
                    '<table class="table table-bordered"><tr><th>Doctor</th><th>Patients</th></tr>';

                data.forEach(row => {

                    html += `
                    <tr>
                        <td>${row.doctorName}</td>
                        <td>${row.patientCount}</td>
                    </tr>
                `;
                });

                html += '</table>';

                document.getElementById(
                    'result'
                ).innerHTML = html;
            });
    }

    function visitCountByDoctor() {

        fetch(
            '/api/reports/visit-count-by-doctor'
        )
            .then(response => response.json())
            .then(data => {

                let html =
                    '<table class="table table-bordered"><tr><th>Doctor</th><th>Visits</th></tr>';

                data.forEach(row => {

                    html += `
                    <tr>
                        <td>${row.doctorName}</td>
                        <td>${row.visitCount}</td>
                    </tr>
                `;
                });

                html += '</table>';

                document.getElementById(
                    'result'
                ).innerHTML = html;
            });
    }

    function topMonth() {

        fetch(
            '/api/reports/top-sickleave-month'
        )
            .then(response => response.json())
            .then(data => {

                document.getElementById(
                    'result'
                ).innerHTML = `
                <div class="alert alert-warning">
                    Month: ${data.value}
                    <br>
                    Count: ${data.count}
                </div>
            `;
            });
    }

    function topDoctor() {

        fetch(
            '/api/reports/top-sickleave-doctor'
        )
            .then(response => response.json())
            .then(data => {

                document.getElementById(
                    'result'
                ).innerHTML = `
                <div class="alert alert-warning">
                    Doctor: ${data.value}
                    <br>
                    Count: ${data.count}
                </div>
            `;
            });
    }

    function showPatients(data) {

        let html =
            '<table class="table table-bordered"><tr><th>Name</th><th>EGN</th></tr>';

        data.forEach(patient => {

            html += `
            <tr>
                <td>${patient.fullName}</td>
                <td>${patient.egn}</td>
            </tr>
        `;
        });

        html += '</table>';

        document.getElementById(
            'result'
        ).innerHTML = html;
    }

    function showExaminations(data) {

        let html =
            '<table class="table table-bordered"><tr><th>Date</th><th>Doctor</th><th>Patient</th><th>Diagnosis</th></tr>';

        data.forEach(examination => {

            html += `
            <tr>
                <td>${examination.examinationDate}</td>
                <td>${examination.doctorName}</td>
                <td>${examination.patientName}</td>
                <td>${examination.diagnosisName}</td>
            </tr>
        `;
        });

        html += '</table>';

        document.getElementById(
            'result'
        ).innerHTML = html;
    }

</script>

<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between">
        <h2>Reports</h2>
        <a href="/" class="btn btn-secondary">Home</a>
    </div>
    <hr>

    <div class="row g-3">
        <div class="col-md-4">
            <label class="form-label">Doctor</label>
            <select id="doctorSelect" class="form-select"></select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Patient</label>
            <select id="patientSelect" class="form-select"></select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Diagnosis</label>
            <select id="diagnosisSelect" class="form-select"></select>
        </div>

        <div class="col-md-3">
            <label class="form-label">Start Date</label>
            <input type="date" id="startDate" class="form-control">
        </div>

        <div class="col-md-3">
            <label class="form-label">End Date</label>
            <input type="date" id="endDate" class="form-control">
        </div>
    </div>

    <hr>

    <div class="row g-2">
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="patientsByDiagnosis()">Patients By Diagnosis</button></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="mostCommonDiagnosis()">Most Common Diagnosis</button></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="patientsByDoctor()">Patients By Doctor</button></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="totalRevenue()">Total Revenue</button></div>

        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="revenueByDoctor()">Revenue By Doctor</button></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="patientCountByDoctor()">Patient Count By Doctor</button></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="visitCountByDoctor()">Visit Count By Doctor</button></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="patientHistory()">Patient History</button></div>

        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="doctorExaminations()">Doctor Examinations</button></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="doctorExaminationsPeriod()">Doctor Examinations Period</button></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="topMonth()">Top Sick Leave Month</button></div>
        <div class="col-md-3"><button class="btn btn-primary w-100" onclick="topDoctor()">Top Sick Leave Doctor</button></div>
    </div>

    <hr>

    <div id="result"></div>
</div>
</body>
</html>
