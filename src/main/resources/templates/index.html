<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <title>Medical Records System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center">

        <h1>Medical Records System</h1>

        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="btn btn-danger">
                Logout
            </button>

        </form>

    </div>

    <hr>

    <div sec:authorize="hasRole('ADMIN')">

        <h3>Administrator Panel</h3>

        <div class="list-group">

            <a href="/doctors-page"
               class="list-group-item list-group-item-action">
                Doctors
            </a>

            <a href="/patients-page"
               class="list-group-item list-group-item-action">
                Patients
            </a>

            <a href="/diagnoses-page"
               class="list-group-item list-group-item-action">
                Diagnoses
            </a>

            <a href="/examinations-page"
               class="list-group-item list-group-item-action">
                Examinations
            </a>

            <a href="/sick-leaves-page"
               class="list-group-item list-group-item-action">
                Sick Leaves
            </a>

            <a href="/reports-page"
               class="list-group-item list-group-item-action">
                Reports
            </a>

        </div>

    </div>

    <div sec:authorize="hasRole('DOCTOR')">

        <h3>Doctor Panel</h3>

        <div class="list-group">

            <a href="/doctor-patients-page"
               class="list-group-item list-group-item-action">
                Patients
            </a>

            <a href="/doctor-examinations-page"
               class="list-group-item list-group-item-action">
                My Examinations
            </a>

            <a href="/doctor-sick-leaves-page"
               class="list-group-item list-group-item-action">
                Sick Leaves
            </a>

        </div>

    </div>

    <div sec:authorize="hasRole('PATIENT')">

        <h3>Patient Panel</h3>

        <div class="list-group">

            <a href="/my-examinations">
                My Examinations
            </a>

        </div>

    </div>

</div>

</body>
</html>
