<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Patients</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between">

        <h2>Patients</h2>

        <a href="/"
           class="btn btn-secondary">
            Home
        </a>

    </div>

    <hr>

    <h4>Add Patient</h4>

    <form id="patientForm">

        <div class="mb-3">

            <label class="form-label">
                Full Name
            </label>

            <input type="text"
                   id="fullName"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                EGN
            </label>

            <input type="text"
                   id="egn"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Personal Doctor
            </label>

            <select id="personalDoctorId"
                    class="form-select">

            </select>

        </div>

        <div class="mb-3 form-check">

            <input type="checkbox"
                   id="insured"
                   class="form-check-input">

            <label class="form-check-label">
                Insured
            </label>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <input type="text"
                   id="username"
                   class="form-control">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <input type="password"
                   id="password"
                   class="form-control">

        </div>

        <button type="submit"
                class="btn btn-primary">
            Add Patient
        </button>

    </form>

    <hr>

    <h4>All Patients</h4>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>EGN</th>

            <th>Insured</th>

            <th>Personal Doctor</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody id="patientsTable">

        </tbody>

    </table>

</div>

<script>

    loadPatients();
    loadDoctors();
    function loadDoctors() {

        fetch('/api/doctors')
            .then(response => response.json())
            .then(data => {

                let select =
                    document.getElementById(
                        'personalDoctorId'
                    );

                select.innerHTML = '';

                data.forEach(doctor => {

                    select.innerHTML += `
                    <option value="${doctor.id}">
                        ${doctor.fullName}
                    </option>
                `;
                });

            });
    }

    function loadPatients() {

        fetch('/api/patients')
            .then(response => response.json())
            .then(data => {

                let table =
                    document.getElementById('patientsTable');

                table.innerHTML = '';

                data.forEach(patient => {

                    table.innerHTML += `
<tr>

        <td>${patient.id}</td>

        <td>${patient.fullName}</td>

        <td>${patient.egn}</td>

        <td>${patient.insured}</td>

        <td>${patient.personalDoctorName}</td>

        <td>

            <button
                class="btn btn-danger btn-sm"
                onclick="deletePatient(${patient.id})">

                Delete

            </button>

        </td>

    </tr>
                    `;
                });

            });
    }

    document.getElementById('patientForm')
        .addEventListener('submit', function (event) {

            event.preventDefault();

            let egn =
                document.getElementById(
                    'egn'
                ).value;

            if (!/^\d{10}$/.test(egn)) {

                alert(
                    'EGN must contain exactly 10 digits.'
                );

                return;
            }

            let patient = {

                fullName:
                document.getElementById(
                    'fullName'
                ).value,

                egn:
                document.getElementById(
                    'egn'
                ).value,

                personalDoctorId:
                    Number(
                        document.getElementById(
                            'personalDoctorId'
                        ).value
                    ),

                insured:
                document.getElementById(
                    'insured'
                ).checked,

                username:
                document.getElementById(
                    'username'
                ).value,

                password:
                document.getElementById(
                    'password'
                ).value
            };

            fetch('/api/patients', {

                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify(patient)

            })
                .then(() => {

                    document.getElementById(
                        'patientForm'
                    ).reset();

                    loadPatients();

                });

        });
    function deletePatient(id) {

        if (!confirm(
            'Delete this patient?'
        )) {

            return;
        }

        fetch('/api/patients/' + id, {

            method: 'DELETE'

        })
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        'Delete failed'
                    );
                }

                loadPatients();

            })
            .catch(error => {

                console.error(error);

                alert(
                    'Error deleting patient'
                );
            });
    }
</script>

</body>
</html>
