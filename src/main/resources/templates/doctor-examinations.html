<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>My Examinations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between">

        <h2>My Examinations</h2>

        <a href="/"
           class="btn btn-secondary">
            Home
        </a>

    </div>

    <hr>

    <div class="card mb-4">

        <div class="card-header">
            Create Examination
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6">

                    <label class="form-label">
                        Patient
                    </label>

                    <select id="patientSelect"
                            class="form-select">
                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label">
                        Diagnosis
                    </label>

                    <select id="diagnosisSelect"
                            class="form-select">
                    </select>

                </div>

            </div>

            <div class="mt-3">

                <label class="form-label">
                    Treatment
                </label>

                <input id="treatment"
                       class="form-control">

            </div>

            <div class="mt-3">

                <label class="form-label">
                    Price
                </label>

                <input id="price"
                       type="number"
                       step="0.01"
                       class="form-control">

            </div>

            <button class="btn btn-primary mt-3"
                    onclick="createExamination()">

                Save

            </button>

        </div>

    </div>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>Date</th>
            <th>Patient</th>
            <th>Diagnosis</th>
            <th>Treatment</th>
            <th>Price</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody id="tableBody">

        </tbody>

    </table>

</div>

<script>

    fetch('/api/examinations/doctor/my')
        .then(response => response.json())
        .then(data => {

            let html = '';

            data.forEach(exam => {

                html += `
    <tr>
        <td>${exam.examinationDate}</td>
        <td>${exam.patientName}</td>
        <td>${exam.diagnosisName}</td>
        <td>${exam.treatment}</td>
        <td>${exam.price}</td>
        <td>
            <button
                class="btn btn-danger btn-sm"
                onclick="deleteExamination(${exam.id})">

                Delete

            </button>
        </td>
    </tr>
                `;
            });

            document.getElementById(
                'tableBody'
            ).innerHTML = html;
        });
    fetch('/api/patients')
        .then(response => response.json())
        .then(data => {

            let html = '';

            data.forEach(patient => {

                html += `
                <option value="${patient.id}">
                    ${patient.fullName}
                </option>
            `;
            });

            document.getElementById(
                'patientSelect'
            ).innerHTML = html;
        });

    fetch('/api/diagnoses')
        .then(response => response.json())
        .then(data => {

            let html = '';

            data.forEach(diagnosis => {

                html += `
                <option value="${diagnosis.id}">
                    ${diagnosis.name}
                </option>
            `;
            });

            document.getElementById(
                'diagnosisSelect'
            ).innerHTML = html;
        });
    function createExamination() {

        const request = {

            doctorId: 0,

            patientId:
            document.getElementById(
                'patientSelect'
            ).value,

            diagnosisId:
            document.getElementById(
                'diagnosisSelect'
            ).value,

            treatment:
            document.getElementById(
                'treatment'
            ).value,

            price:
            document.getElementById(
                'price'
            ).value
        };

        fetch('/api/examinations/doctor', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify(request)

        })
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        'Failed to create examination'
                    );
                }

                return response.json();
            })
            .then(() => {

                location.reload();

            })
            .catch(error => {

                alert(
                    'Error creating examination'
                );

                console.error(error);
            });
    }
    function deleteExamination(id) {

        if (!confirm(
            'Delete this examination?'
        )) {

            return;
        }

        fetch(
            '/api/examinations/' + id,
            {
                method: 'DELETE'
            }
        )
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        'Delete failed'
                    );
                }

                location.reload();
            })
            .catch(error => {

                console.error(error);

                alert(
                    'Error deleting examination'
                );
            });
    }
</script>


</body>
</html>
